name: Release

# Push a tag such as v1.0.1 to run every CI check, verify that the tag matches
# the version in the code, and publish a GitHub Release with the plugin zip.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches the plugin version
        run: bash bin/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build zip
        run: |
          mkdir -p build
          git archive --format=zip --prefix=themetoggle/ \
            --output="build/themetoggle-${GITHUB_REF_NAME#v}.zip" HEAD
          unzip -l "build/themetoggle-${GITHUB_REF_NAME#v}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/themetoggle-${GITHUB_REF_NAME#v}.zip" \
            --title "ThemeToggle ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
